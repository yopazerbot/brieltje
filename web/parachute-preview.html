<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Parachute preview</title>
  <!-- A dev-only page for the parachute's assets (src/dev/parachutePreview.ts). Not linked from the game, not in the build. -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a9c4dc; font: 14px/1.35 system-ui, sans-serif; color: #fff; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .panel { position: fixed; background: rgba(20, 24, 28, 0.62); border-radius: 8px; padding: 6px 10px; white-space: pre-line; pointer-events: none; }
    #note { top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); max-width: 46vw; }
    #note b { color: #ffd38a; font-weight: 600; }
    #stats { top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); text-align: right; font-variant-numeric: tabular-nums; }
    #tools { position: fixed; top: 64px; right: max(8px, env(safe-area-inset-right)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    #steer { position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; padding: 0 max(12px, env(safe-area-inset-left)); pointer-events: none; }
    #steer > * { pointer-events: auto; }
    button { font: inherit; color: #fff; background: rgba(20, 24, 28, 0.62); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 8px; padding: 8px 12px; min-height: 40px; touch-action: none; user-select: none; -webkit-user-select: none; }
    #steer button { min-width: 84px; min-height: 64px; font-size: 16px; border-radius: 14px; }
    button.on { background: rgba(224, 115, 58, 0.85); }
    @media (max-height: 500px) { .panel { font-size: 11px; } #note { max-width: 40vw; } button { padding: 4px 8px; min-height: 32px; } #tools { top: 48px; } }
    body.bare .panel, body.bare #tools, body.bare #steer { display: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="note" class="panel"><b>Visual prototype</b>: the falling and steering only show the animations. They are not the game's flight rules.
<span id="hud">Loading...</span></div>
  <div id="stats" class="panel"></div>
  <div id="tools">
    <button id="cam" type="button">Third person</button>
    <button id="reset" type="button">Reset</button>
    <button id="crowd" type="button">x16</button>
    <button id="lod" type="button">LOD auto</button>
    <button id="quality" type="button">Low</button>
  </div>
  <div id="steer">
    <button id="left" type="button">Left</button>
    <button id="flare" type="button">Flare</button>
    <button id="right" type="button">Right</button>
  </div>
  <script type="module" src="/src/dev/parachutePreview.ts"></script>
</body>
</html>
