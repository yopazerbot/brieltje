<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title data-nl="Gesplitst scherm · Brieltje">Split screen · Brieltje</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/menu-theme.css" />
    <script src="/lang-early.js"></script>
    <script type="module" src="/src/splitscreen/page.ts"></script>
  </head>
  <body>
    <!-- Split screen: up to four players on one computer, each in a copy of the game (src/splitscreen/page.ts). Linked from nowhere.
         Four steps: how many, the controllers, the names and the PIN, then joining. Every step works with a controller too. -->
    <main id="setup" hidden>
      <div class="card">
        <header>
          <img class="brand" src="/brand/wordmark.svg" alt="Brieltje" width="120" height="36" />
          <div class="langs" role="group" aria-label="Language" data-i18n-aria="lang.label">
            <button type="button" data-lang="en" lang="en">English</button><button type="button" data-lang="nl" lang="nl">Nederlands</button>
          </div>
        </header>
        <h1 data-i18n="split.heading">Split screen</h1>
        <ol class="steps" id="steps">
          <li data-step="1"><b>1</b> <span data-i18n="split.step.count"></span></li>
          <li data-step="2"><b>2</b> <span data-i18n="split.step.pads"></span></li>
          <li data-step="3"><b>3</b> <span data-i18n="split.step.names"></span></li>
          <li data-step="4"><b>4</b> <span data-i18n="split.step.start"></span></li>
        </ol>

        <!-- 1: how many -->
        <section id="step-1" class="step">
          <h2 data-i18n="split.countQ"></h2>
          <p class="muted" data-i18n="split.intro"></p>
          <div id="again" class="again" hidden>
            <p id="again-text"></p>
            <div class="row">
              <button type="button" class="btn" id="go-on" data-i18n="split.goOn"></button>
              <button type="button" class="btn ghost" id="fresh" data-i18n="split.fresh"></button>
            </div>
          </div>
          <div class="counts">
            <button type="button" class="count" data-count="2"><b>2</b><span></span></button>
            <button type="button" class="count" data-count="3"><b>3</b><span></span></button>
            <button type="button" class="count" data-count="4"><b>4</b><span></span></button>
          </div>
        </section>

        <!-- 2: the controllers -->
        <section id="step-2" class="step" hidden>
          <h2 data-i18n="split.padsQ"></h2>
          <p class="muted" data-i18n="split.padsHow"></p>
          <div class="seats" id="pad-cards"></div>
          <details class="trouble">
            <summary data-i18n="split.trouble"></summary>
            <ul><li data-i18n="split.trouble1"></li><li data-i18n="split.trouble2"></li><li data-i18n="split.trouble3"></li></ul>
          </details>
          <p class="error" id="pads-error" role="alert" hidden></p>
          <div class="nav"><button type="button" class="btn ghost" data-back data-i18n="split.backBtn"></button><button type="button" class="btn" data-next data-i18n="split.next"></button></div>
        </section>

        <!-- 3: names and the PIN -->
        <section id="step-3" class="step" hidden>
          <h2 data-i18n="split.namesQ"></h2>
          <p class="muted" data-i18n="split.namesHow"></p>
          <div class="seats" id="name-cards"></div>
          <div class="pin-box">
            <label class="field" for="pin" data-i18n="split.pinHow"></label>
            <input id="pin" type="password" inputmode="numeric" maxlength="12" autocomplete="off" />
            <div class="numpad" id="numpad"></div>
            <p class="muted small" data-i18n="start.pinHint"></p>
            <p class="error" id="pin-error" role="alert" hidden></p>
          </div>
          <label class="check"><input type="checkbox" id="age" /> <span data-i18n="split.age"></span></label>
          <p class="error" id="names-error" role="alert" hidden></p>
          <div class="nav"><button type="button" class="btn ghost" data-back data-i18n="split.backBtn"></button><button type="button" class="btn" data-next data-i18n="split.next"></button></div>
        </section>

        <!-- 4: joining -->
        <section id="step-4" class="step" hidden>
          <h2 data-i18n="split.startQ"></h2>
          <p class="muted" data-i18n="split.startHow"></p>
          <div class="seats" id="start-cards"></div>
          <p class="error" id="start-error" role="alert" hidden></p>
          <div class="nav">
            <button type="button" class="btn ghost" data-back data-i18n="split.backBtn"></button>
            <button type="button" class="btn ghost" id="fix" data-i18n="split.fix" hidden></button>
            <button type="button" class="btn" id="start" data-next data-i18n="split.start"></button>
          </div>
        </section>
        <p class="muted small pad-nav" id="pad-nav"></p>
        <!-- As on the start screen (index.html): the links to the legal pages get ?lang= in the page's language (src/i18n.ts). -->
        <footer class="foot">
          <p class="links"><a class="gh" href="https://github.com/yopazerbot/brieltje" target="_blank" rel="noopener noreferrer" title="The source code on GitHub" data-i18n-title="credit.source"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span>GitHub</span></a> · <a href="/legal/credits.html" target="_blank" rel="noopener noreferrer" data-i18n="legal.credits">Credits</a> · <a href="/legal/terms.html" target="_blank" rel="noopener noreferrer" data-i18n="legal.termsShort">Terms</a> · <a href="/legal/privacy.html" target="_blank" rel="noopener noreferrer" data-i18n="legal.privacyShort">Privacy</a></p>
          <p class="legal"><span data-i18n="legal.accept">By playing you accept the</span> <a href="/legal/terms.html" target="_blank" rel="noopener noreferrer" data-i18n="legal.terms">terms of use</a> <span data-i18n="legal.and">and the</span> <a href="/legal/privacy.html" target="_blank" rel="noopener noreferrer" data-i18n="legal.privacy">privacy policy</a>. <span data-i18n="credit.made">Made by Yoshi Parlevliet</span></p>
        </footer>
      </div>
    </main>

    <div id="grid" class="grid" hidden></div>
    <div id="tools" class="tools" hidden>
      <button type="button" id="full" data-i18n="split.full">Full screen</button>
      <button type="button" id="stop" data-i18n="split.stop">Stop</button>
    </div>
  </body>
</html>
