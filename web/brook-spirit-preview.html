<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Brook spirit preview</title>
  <!-- A dev-only page for the brook spirit's look (src/dev/brookSpiritPreview.ts). Not linked from the game, not in the build. -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #20262b; font: 14px/1.35 system-ui, sans-serif; color: #fff; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .panel { position: fixed; background: rgba(20, 24, 28, 0.62); border-radius: 8px; padding: 6px 10px; }
    #note { top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); max-width: 46vw; white-space: pre-line; pointer-events: none; }
    #note b { color: #ffd38a; font-weight: 600; }
    #stats { bottom: max(8px, env(safe-area-inset-bottom)); left: max(8px, env(safe-area-inset-left)); font-variant-numeric: tabular-nums; pointer-events: none; }
    #tools { top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); display: grid; grid-template-columns: auto 120px; gap: 4px 8px; align-items: center; }
    #tools label { text-align: right; }
    #tools input[type=range] { width: 120px; }
    #buttons { position: fixed; right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 60vw; }
    button { font: inherit; color: #fff; background: rgba(20, 24, 28, 0.62); border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 8px; padding: 8px 12px; min-height: 40px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    button.on { background: rgba(224, 115, 58, 0.85); }
    @media (max-height: 500px) { .panel, button { font-size: 11px; } button { padding: 4px 8px; min-height: 32px; } #tools input[type=range] { width: 90px; } #tools { grid-template-columns: auto 90px; } }
    body.bare .panel, body.bare #buttons { display: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="note" class="panel"><b>Look only</b>: no rules, no attacks. Drag to orbit, wheel or pinch to zoom.
Keys: O open, S shield, A anger, R reach, F fade, H hurt, N night, Q quality, M move, 1 near, 2 far.</div>
  <div id="tools" class="panel">
    <label for="open">open</label><input id="open" type="range" min="0" max="1" step="0.01" value="0">
    <label for="shield">shield</label><input id="shield" type="range" min="0" max="1" step="0.01" value="0">
    <label for="anger">anger</label><input id="anger" type="range" min="0" max="1" step="0.01" value="0">
    <label for="fade">fade</label><input id="fade" type="range" min="0" max="1" step="0.01" value="0">
  </div>
  <div id="buttons">
    <button id="reach" type="button">Reach</button>
    <button id="hurt" type="button">Hurt</button>
    <button id="move" type="button">Move</button>
    <button id="night" type="button">Night</button>
    <button id="quality" type="button">High</button>
    <button id="near" type="button">4 m</button>
    <button id="far" type="button">25 m</button>
  </div>
  <div id="stats" class="panel"></div>
  <script type="module" src="/src/dev/brookSpiritPreview.ts"></script>
</body>
</html>
