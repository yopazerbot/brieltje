# Grafana's one data source: Prometheus beside it on the compose network (lan/compose.yaml). Read only from the UI.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 2s
      httpMethod: POST
