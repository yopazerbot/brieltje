# A LAN night on this computer, in Docker: double-click lan.cmd (it asks for the admin password and runs this), or
#   ADMIN_PASSWORD=... docker compose -f lan/compose.yaml up --build -d
# The game on http://<this computer's address>:8080 (LAN_PORT to change it). Tonight's players, accounts and rules
# stay in the volume brieltje-lan-data, apart from brieltje.be's and from a developer's web/.data.
name: brieltje-lan
services:
  game:
    build:
      context: ../web
      dockerfile: ../lan/Dockerfile
    image: brieltje-lan
    restart: on-failure # never again by itself after a restart of Docker or the computer: tonight only
    ports:
      - "${LAN_PORT:-8080}:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (lan.cmd asks for it)}
      PORT: "8080"
    volumes:
      - brieltje-lan-data:/app/.data
volumes:
  brieltje-lan-data:
