# A LAN night on this computer, in Docker: double-click lan.cmd. It asks for the admin password, starts this, and puts
# Caddy (lan/Caddyfile) in front of it: https://lan.brieltje.be, or http://<this computer's address>:8080 with -Http.
# The game's own port is open to this computer only (127.0.0.1): players reach it through Caddy, which passes on their
# address; the game believes that header (TRUST_PROXY), so nobody else may reach the port and write it themselves.
# Tonight's players, accounts and rules stay in the volume brieltje-lan-data, apart from brieltje.be's and from a
# developer's web/.data.
#
# lan.cmd -Monitor also starts the profile `monitor` (lan/monitor/README.md): Prometheus and Grafana beside the game.
# The game then answers Prometheus on METRICS_PORT inside this compose network only (never published); Prometheus has
# no published port at all; Grafana is published on 127.0.0.1 only, never on the hall's network.
name: brieltje-lan
services:
  game:
    build:
      context: ../web
      dockerfile: ../lan/Dockerfile
    image: brieltje-lan
    restart: on-failure # never again by itself after a restart of Docker or the computer: tonight only
    ports:
      - "127.0.0.1:${LAN_GAME_PORT:-18080}:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (lan.cmd asks for it)}
      PORT: "8080"
      TRUST_PROXY: "1"
      # production over https: secure cookies and https links (server.mjs SECURE); empty over plain http.
      NODE_ENV: ${LAN_NODE_ENV:-}
      # The server's own numbers for Prometheus (web/server/metrics.mjs): only with lan.cmd -Monitor (9464), else off.
      # On all of the container's addresses, which are on this compose network only: the port is not in `ports`.
      METRICS_PORT: ${LAN_METRICS_PORT:-}
      METRICS_HOST: "0.0.0.0"
    volumes:
      - brieltje-lan-data:/app/.data

  # The server's numbers over the evening, two days kept. On this compose network only: no `ports`.
  prometheus:
    profiles: [monitor]
    # Prometheus 3.13.5, the long-term-support line (security fixes until July 2027), Apache-2.0.
    image: prom/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
    restart: on-failure
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.listen-address=:9090
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - brieltje-lan-prometheus:/prometheus
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Never more than this, whatever happens to it: the game comes first.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      start_period: 20s

  # The dashboards (lan/monitor/grafana/), on this computer only: http://localhost:3030 (lan.cmd -Monitor -MonitorPort).
  grafana:
    profiles: [monitor]
    # Grafana OSS 13.3.1, AGPL-3.0, run unmodified. Every panel the dashboards use ships in it: no plugin is fetched.
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    restart: on-failure
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LAN_GRAFANA_PORT:-3030}:3000"
    environment:
      # The admin: "admin" with tonight's admin password (start.ps1 sets it again at every start; never in a file).
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (lan.cmd asks for it)}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: 1d
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # Asked under another name (a page in a browser here pointing its own domain at 127.0.0.1: DNS rebinding), Grafana
      # sends it to localhost instead of answering, where that page's script can't read the answer.
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: http://localhost:${LAN_GRAFANA_PORT:-3030}/
      GF_SERVER_ENFORCE_DOMAIN: "true"
      # Nothing phones home, and nothing needs the internet on the night (lan/monitor/README.md lists each).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_CLOUD_MIGRATION_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/game-night.json
    volumes:
      - ./monitor/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitor/grafana/dashboards:/etc/grafana/dashboards:ro
      - brieltje-lan-grafana:/var/lib/grafana
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s

volumes:
  brieltje-lan-data:
  brieltje-lan-prometheus:
  brieltje-lan-grafana:
